<body>

        </div>


        <nav>

    <!-- ================= SEARCH AREA ================= -->

    <section class="search-section">

        <div class="search-container">

            <h1>
                Find the Best Price
            </h1>

            <p>
                Search thousands of products and compare prices
                from multiple online stores.
            </p>


            <div class="search-box">

                    type="text"

    <main class="search-results-container">

        <div class="results-header">

            <div>

                </p>

                <h2 id="resultsTitle">
                    Search for a product
                </h2>

            </div>

            <span id="resultCount"></span>

        </div>


        <div id="results">

            <div class="empty-results">

                <div class="empty-icon">
                    🔍
                </div>

                <h3>
                    What are you looking for?
                </h3>

                <p>
                    Search for a phone, laptop, headphones,
                    TV or any other product.
                </p>

            </div>

        </div>

    </main>

<script src="products.js"></script>
    <!-- ================= JAVASCRIPT ================= -->

    <script>
        




// ==========================================
// SEARCH
// ==========================================

function searchProduct() {

    const input =
        document.getElementById("productSearch");

    const results =
        document.getElementById("results");

    const resultsTitle =
        document.getElementById("resultsTitle");

    const resultCount =
        document.getElementById("resultCount");


    const query =
        input.value.trim().toLowerCase();


    // Empty search
    if (query === "") {

        resultsTitle.textContent =
            "Search for a product";

        resultCount.textContent = "";

        results.innerHTML = `

            <div class="empty-results">

                <div class="empty-icon">
                    🔍
                </div>

                <h3>
                    What are you looking for?
                </h3>

                <p>
                    Enter a product name above.
                </p>

            </div>
        `;

        return;
    }


    // Find matching products
    const matchingProducts =
         productCatalog.filter(
            function(product) {

                return (
                    product.name
                        .toLowerCase()
                        .includes(query)

                    ||

                    product.category
                        .toLowerCase()
                        .includes(query)
                );

            }
        );


    // No results
    if (matchingProducts.length === 0) {

        resultsTitle.textContent =
            `No results for "${input.value}"`;

        resultCount.textContent =
            "0 products found";

        results.innerHTML = `

            <div class="empty-results">

                <div class="empty-icon">
                    🔎
                </div>

                <h3>
                    No products found
                </h3>

                <p>
                    Try iPhone, Samsung,
                    MacBook, Sony or OnePlus.
                </p>

            </div>
        `;

        return;
    }


    // Heading
    resultsTitle.textContent =
        `Results for "${input.value}"`;

    resultCount.textContent =
        matchingProducts.length +
        " product" +
        (matchingProducts.length > 1 ? "s" : "") +
        " found";


    // Clear results
    results.innerHTML = "";


    // Build cards
    matchingProducts.forEach(
        function(product) {

            const card =
                document.createElement("div");

            card.className =
                "search-product-card";


            card.innerHTML = `

                <div class="search-product-image image-fallback">
                    ${product.icon}
                </div>


                <div class="search-product-info">

                    <span class="product-category">
                        ${product.category}
                    </span>

                    <h3>
                        ${product.name}
                    </h3>

                    <div class="product-rating">
                        ⭐ ${product.rating}
                    </div>

                </div>


                <div class="search-product-price">

                    <small>
                        Starting from
                    </small>

                    <strong>
                        ₹${getLowestProductPrice(product).toLocaleString("en-IN")}
                    </strong>

                    <button
                        class="compare-price-btn"
                        onclick="compareProduct('${product.name}')"
                    >
                        Compare Prices →
                    </button>

                </div>

            `;


            results.appendChild(card);

        }
    );

}


// ==========================================
// OPEN COMPARISON PAGE
// ==========================================

function compareProduct(productName) {

    window.location.href =
        "comparison.html?product=" +
        encodeURIComponent(productName);

}


// ==========================================
// ENTER KEY SEARCH
// ==========================================

document.addEventListener(
    "DOMContentLoaded",
    function() {

        const input =
            document.getElementById(
                "productSearch"
            );


        input.addEventListener(
            "keydown",
            function(event) {

                if (event.key === "Enter") {

                    searchProduct();

                }

            }
        );

    }
);


    </script>
